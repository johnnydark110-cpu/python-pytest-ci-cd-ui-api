[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: fast core checks
    regression: broader behavior checks
    serial: must run without xdist in the serial lane
    known_flaky: temporary flaky debt; requires issue, owner, expires and reason
