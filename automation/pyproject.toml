[project]
name = "automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "faker>=40.54.0",
    "jsonschema>=4.26.0",
    "playwright>=1.65.2",
    "pytest>=9.2.0",
    "pytest-html>=4.2.0",
    "pytest-rerunfailures>=16.7",
    "pytest-xdist>=3.8.0",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "services", "tests", "utils"]
