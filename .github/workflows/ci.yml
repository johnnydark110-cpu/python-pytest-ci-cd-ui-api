name: Automation Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-tests:
    name: API and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Install Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3

      - name: Run static checks
        run: |
          ruff check .
          git diff --check

      - name: Validate Compose configuration
        run: |
          docker compose config

      - name: Prepare report directories
        run: |
          mkdir -p automation/reports
          mkdir -p automation/screenshots
      
      - name: Restore analytics history
        uses: actions/cache/restore@v4
        with:
          path: automation/reports/analytics/history.json
          key: automation-analytics-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            automation-analytics-${{ github.ref_name }}-

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start application
        run: |
          docker compose up -d --wait app
          docker compose ps
          docker compose logs app

      - name: Run automation tests
        id: tests
        run: |
          docker compose run --rm automation

      - name: Build failure analytics
        id: analytics
        if: always()
        run: |
          if find automation/reports -maxdepth 1 \
            -type f -name 'flaky-*.json' | grep -q .; then

            docker compose run --rm --no-deps automation \
              uv run python report_analytics.py \
              --report-dir reports \
              --history reports/analytics/history.json \
              --output reports/analytics/dashboard.json \
              --summary-md reports/analytics/summary.md \
              --run-id "$GITHUB_RUN_ID" \
              --commit "$GITHUB_SHA" \
              --branch "$GITHUB_REF_NAME"
          else
            echo "没有可分析的 flaky 报告，跳过分析。"
          fi
      
      - name: Save analytics history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/reports/analytics/history.json
          key: automation-analytics-${{ github.ref_name }}-${{ github.run_id }}

      - name: Collect Docker logs
        if: always()
        run: |
          docker compose logs --no-color \
            > automation/reports/docker-compose.log || true

      - name: Upload raw automation reports
        id: report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: automation-reports-${{ github.run_id }}
          path: |
            automation/reports/
            automation/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Write test job summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo "## 自动化测试结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 测试结果：\`${TEST_OUTCOME:-not-run}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支：\`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 原始报告：[下载 artifacts](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actions：[查看运行](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
      
      - name: Append analytics summary
        if: always()
        run: |
          SUMMARY_FILE="automation/reports/analytics/summary.md"

          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "没有分析摘要可追加。"
          fi

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"text\":\"自动化测试失败：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\\n原始报告：${REPORT_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v

  publish-allure:
    name: Publish Allure report
    needs: automation-tests
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download raw reports
        uses: actions/download-artifact@v5
        with:
          name: automation-reports-${{ github.run_id }}
          path: downloaded

      - name: Inspect downloaded artifact
        run: |
          echo "Downloaded tree:"
          find downloaded -maxdepth 5 -type f -print | sort

      - name: Locate Allure results
        run: |
          set -euo pipefail

          RESULTS_DIR="$(find downloaded -type d -name docker-allure -print -quit)"

          if [ -z "$RESULTS_DIR" ]; then
            echo "ERROR: docker-allure directory was not found."
            echo "Artifact directories:"
            find downloaded -maxdepth 5 -type d -print | sort
            exit 1
          fi

          mkdir -p allure-work
          cp -R "$RESULTS_DIR" allure-work/docker-allure

          echo "Allure results source: $RESULTS_DIR"
          echo "ALLURE_RESULTS_DIR=allure-work/docker-allure" >> "$GITHUB_ENV"

      - name: Restore Allure history
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: allure-work/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-

      - name: Install Java and Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-21-jre-headless \
            unzip

          curl --location --fail --silent --show-error \
            --output /tmp/allure.zip \
            https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.zip

          unzip -q /tmp/allure.zip -d /tmp/allure
          echo "/tmp/allure/allure-2.46.2/bin" >> "$GITHUB_PATH"

      - name: Generate static Allure report
        run: |
          set -euo pipefail

          HISTORY_DIR="allure-work/allure-history"
          REPORT_DIR="allure-work/allure-report"

          if [ -d "$HISTORY_DIR" ]; then
            mkdir -p "$ALLURE_RESULTS_DIR/history"
            cp -R "$HISTORY_DIR"/. "$ALLURE_RESULTS_DIR/history"/
          fi

          allure generate "$ALLURE_RESULTS_DIR" \
            --output "$REPORT_DIR" \
            --clean

          rm -rf "$HISTORY_DIR"
          cp -R "$REPORT_DIR/history" "$HISTORY_DIR"

      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-work/allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Allure report
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-work/allure-report

      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish report URL
        run: |
          echo "## Allure 报告已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[打开最新 Allure 报告](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"