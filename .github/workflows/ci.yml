name: Automation Tests

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation-tests:
    name: API and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Install Ruff
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3

      - name: Run static checks
        run: |
          ruff check .
          git diff --check

      - name: Validate Compose configuration
        run: |
          docker compose config

      - name: Prepare report directories
        run: |
          mkdir -p automation/reports
          mkdir -p automation/screenshots

      - name: Build Docker images
        run: |
          docker compose build

      - name: Start application
        run: |
          docker compose up -d --wait app
          docker compose ps
          docker compose logs app

      - name: Run automation tests
        id: tests
        run: |
          docker compose run --rm automation

      - name: Collect Docker logs
        if: always()
        run: |
          docker compose logs --no-color \
            > automation/reports/docker-compose.log || true

      - name: Upload automation reports
        id: report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: automation-reports-${{ github.run_id }}
          path: |
            automation/reports/
            automation/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo "## 自动化测试结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 测试结果：\`${TEST_OUTCOME:-not-run}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交：\`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 分支：\`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 报告：[下载 HTML、Allure、截图和日志](${REPORT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actions 运行：[查看本次运行](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "{\"text\":\"自动化测试失败：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\\n报告：${REPORT_URL}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Stop containers
        if: always()
        run: |
          docker compose down -v