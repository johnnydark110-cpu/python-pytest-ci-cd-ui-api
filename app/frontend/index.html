<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单管理系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <header>
    <h1>订单管理系统</h1>
    <div id="user-bar" hidden>
      <span id="user-greeting" data-testid="user-greeting"></span>
      <button id="logout-button" data-testid="logout-button">退出登录</button>
    </div>
  </header>

  <main>
    <section id="auth-panel" data-testid="auth-panel">
      <div class="card">
        <h2 id="auth-title" data-testid="auth-title">登录</h2>
        <form id="auth-form">
          <input id="username" data-testid="auth-username" placeholder="用户名" autocomplete="username">
          <input id="password" type="password" data-testid="auth-password" placeholder="密码"
            autocomplete="current-password">
          <button type="submit" id="auth-submit" data-testid="auth-submit">登录</button>
        </form>
        <p id="auth-message" data-testid="auth-message"></p>
        <p><a href="#" id="auth-switch" data-testid="auth-switch">没有账号？去注册</a></p>
      </div>
    </section>

    <section id="orders-panel" data-testid="orders-panel" hidden>
      <div class="toolbar">
        <input id="search-input" data-testid="order-search-input" placeholder="按标题搜索">
        <button id="search-button" data-testid="order-search-button">搜索</button>
      </div>

      <form id="order-form" class="order-form">
        <input id="order-title" data-testid="order-title-input" placeholder="订单标题" required>
        <input id="order-amount" data-testid="order-amount-input" type="number" step="0.01" min="0.01" placeholder="金额"
          required>
        <select id="order-status" data-testid="order-status-select">
          <option value="pending">pending</option>
          <option value="paid">paid</option>
          <option value="shipped">shipped</option>
          <option value="done">done</option>
          <option value="canceled">canceled</option>
        </select>
        <button type="submit" id="order-create-submit" data-testid="order-create-submit">新增订单</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>标题</th>
            <th>金额</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="order-list" data-testid="order-list"></tbody>
      </table>

      <div id="pagination" data-testid="pagination">
        <button id="prev-page" data-testid="order-prev-page">上一页</button>
        <span id="page-info" data-testid="page-info"></span>
        <button id="next-page" data-testid="order-next-page">下一页</button>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
